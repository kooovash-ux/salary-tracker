<div class="table-wrap"><table><thead><tr>

      <button id="doImportBtn" style="margin-top:6px;padding:8px 16px;background:rgba(99,102,241,.08);color:#6366f1;border:1px solid rgba(99,102,241,.12);cursor:pointer;font-size:12px;font-family:Inter;border-radius:8px;font-weight:600">Импортировать</button>
    </div>

<script>
const STORAGE_KEY = 'salary_tracker';

function fmtDate(d){return d.toISOString().slice(0,10)}
function parseDate(s){let p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function fm(n){return n.toLocaleString('ru-RU')}

const WHITE_ADV = 14000, GRAY_ADV = 55000;
const WHITE_SAL = 21670, GRAY_SAL = 65330;
const INDIA_AMOUNT = 30000; // Согласованное в Индии (для детальной таблицы начислений, справочно)

// ===== Правила расчёта долга по методике Светланы (бухгалтер) =====
// Подтверждено ей лично 21.08.2026, долг на 01.08.2026 = 189 560 сошёлся точно.
// 1. Долг на 01.06.2026 = 240 900 — стартовая база (её цифру дала Оксана).
//    Эта база уже включает всё, что произошло по 09.06.2026 включительно
//    (в т.ч. платёж 321 680 от 09.06) — повторно эти деньги не считаем.
// 2. Каждый месяц (с июня и далее, включая текущий незакрытый) начисляется
//    ФИКСИРОВАННО 180 000 ₽ — это ОДНА сумма на всё: белая зарплата + серая
//    доплата + Согласовано в Индии. От числа рабочих дней не зависит.
// 3. Белая часть внутри 180 000 — тоже фиксированная: 41 000 оклад минус 13%
//    НДФЛ (5 330) = 35 670 на руки, всегда двумя платежами (14 000 аванс +
//    21 670 зарплата).
// 4. Всё остальное (144 330 = 180 000 − 35 670) идёт без графика, любыми
//    поступлениями — считается по факту того, что реально пришло.
// 5. Действует СДВИГ НА МЕСЯЦ (подтверждено ей напрямую 21.08.2026): деньги,
//    пришедшие в месяце M+1, закрывают потребность месяца M. Пример: 145 000,
//    полученные 10.08, закрывают ИЮЛЬ, а не август ("август ещё не закончился").
//    На итоговую сумму долга этот сдвиг не влияет (это просто который из
//    месяцев считается "закрытым"), поэтому в формуле ниже отдельно не
//    учитывается — просто суммируются все поступления после базовой даты.
// 6. Излишек сверх месячной потребности уменьшает НАКОПЛЕННЫЙ долг, а не
//    текущий месяц.
// 7. % (старый долг, 50 160) — отдельно, в этот расчёт НЕ входит вообще,
//    Светлана его не считает и не видит.
const SVETLANA_BASE_DEBT = 240900;
const SVETLANA_BASE_DATE = '2026-06-01';
const SVETLANA_CUTOFF_DATE = '2026-06-09'; // поступления по эту дату уже внутри базы
const SVETLANA_MONTHLY_TOTAL = 180000; // бел+сер+Индия вместе, подтверждено Светланой

const DATA_VERSION = 2;
const APP_PIN = '1234'; // ПИН-код для входа
// Clear old session PIN on new version
if(sessionStorage.getItem('salary_pin') && sessionStorage.getItem('salary_pin') !== APP_PIN){
  sessionStorage.removeItem('salary_pin');
}

function defaultData(){
  return {
    version: DATA_VERSION,
    interestDebt: 50160,
    accruals: [],
    payments: [],
    nextAccId: 1,
    nextPayId: 1
  };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}

// ===== Облачное хранилище (GitHub Gist) — синхронизация между устройствами =====
// Токен НЕ хранится в коде/репозитории (это было бы виден всем в паблик-репо
// и его отзовёт сам GitHub). Вместо этого он спрашивается один раз на
// устройстве и живёт только в localStorage этого браузера.
const GIST_ID = '45e4ee608c55f5b45204054e39444116';
const GIST_FILENAME = 'salary-data.json';
const TOKEN_KEY = 'gist_token';

function getGistToken(){
  let t = localStorage.getItem(TOKEN_KEY);
  if(!t){
    t = prompt('Токен для синхронизации (создан на github.com/settings/tokens, права только Gist):');
    if(t) localStorage.setItem(TOKEN_KEY, t.trim());
  }
  return t;
}

async function fetchCloudData(){
  const token = getGistToken();
  if(!token) return null;
  try{
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { 'Authorization': `token ${token}` }
    });
    if(!res.ok) return null;
    const json = await res.json();
    const file = json.files && json.files[GIST_FILENAME];
    if(!file || !file.content) return null;
    return JSON.parse(file.content);
  }catch(e){ return null; }
}

async function pushCloudData(data){
  const token = localStorage.getItem(TOKEN_KEY);
  if(!token){ setSyncStatus(false); return; }
  try{
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } } })
    });
    setSyncStatus(true);
  }catch(e){ setSyncStatus(false); }
}

function setSyncStatus(ok){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = ok ? 'облако ✓' : 'офлайн, не синхронизировано';
  el.style.color = ok ? '#2f9e44' : '#e03131';
}

function saveData(d, pushCloud){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  if(pushCloud !== false) pushCloudData(d);
}

function seedData(){
  const d = defaultData();
  // March - June 2026 real data + correction + Согл. в Индии (4x30k)
  // Total accrued: 592,660 (472,660 salary + 120,000 India), paid: 321,680, remaining: 270,980
  // FIFO distribution: oldest accruals paid first
  d.accruals = [
    {id:1,date:'2026-03-01',type:'Согл. в Индии',white:0,gray:30000,paid:0},
    {id:2,date:'2026-03-25',type:'Аванс',white:14000,gray:55000,paid:69000},
    {id:3,date:'2026-04-01',type:'Согл. в Индии',white:0,gray:30000,paid:0},
    {id:4,date:'2026-04-05',type:'Зарплата',white:21670,gray:65330,paid:87000},
    {id:5,date:'2026-04-25',type:'Аванс',white:14000,gray:55000,paid:69000},
    {id:6,date:'2026-05-01',type:'Согл. в Индии',white:0,gray:30000,paid:0},
    {id:7,date:'2026-05-05',type:'Зарплата',white:21670,gray:30660,paid:52330},
    {id:8,date:'2026-05-05',type:'Доп. начисление',white:0,gray:34670,paid:34670},
    {id:9,date:'2026-05-25',type:'Аванс',white:14000,gray:55000,paid:9680},
    {id:10,date:'2026-06-01',type:'Согл. в Индии',white:0,gray:30000,paid:0},
    {id:11,date:'2026-06-05',type:'Зарплата',white:21670,gray:65330,paid:0},
    {id:12,date:'2026-06-09',type:'Корректировка',white:0,gray:4660,paid:0}
  ];
  d.payments = [
    {id:1,date:'2026-06-09',amount:321680,comment:'Выплаты до 09.06'}
  ];
  d.nextAccId = 13;
  d.nextPayId = 2;
  return d;
}

function generateAutoAccruals(data){
  const now = new Date();
  let maxDate = null;
  for(const a of data.accruals){
    const d = parseDate(a.date);
    if(!maxDate||d>maxDate) maxDate=d;
  }
  if(!maxDate) maxDate=new Date(now.getFullYear(),now.getMonth(),1);

  const sy=maxDate.getFullYear(), sm=maxDate.getMonth();
  const ey=now.getFullYear(), em=now.getMonth();

  let changed=false;
  for(let y=sy;y<=ey;y++){
    const mn=(y===sy)?sm:0, mx=(y===ey)?em:11;
    for(let m=mn;m<=mx;m++){
      // 1st - Согласованное в Индии
      const d1=new Date(y,m,1);
      if(d1>maxDate&&d1<=now){
        const ds=fmtDate(d1);
        if(!data.accruals.find(a=>a.date===ds&&a.type==='Согл. в Индии')){
          data.accruals.push({id:data.nextAccId++,date:ds,type:'Согл. в Индии',white:0,gray:INDIA_AMOUNT,paid:0});
          changed=true;
        }
      }
      const d25=new Date(y,m,25);
      if(d25>maxDate&&d25<=now){
        const ds=fmtDate(d25);
        if(!data.accruals.find(a=>a.date===ds&&a.type==='Аванс')){
          data.accruals.push({id:data.nextAccId++,date:ds,type:'Аванс',white:WHITE_ADV,gray:GRAY_ADV,paid:0});
          changed=true;
        }
      }
      const d5=new Date(y,m+1,5);
      if(d5>maxDate&&d5<=now){
        const ds=fmtDate(d5);
        if(!data.accruals.find(a=>a.date===ds&&a.type==='Зарплата')){
          data.accruals.push({id:data.nextAccId++,date:ds,type:'Зарплата',white:WHITE_SAL,gray:GRAY_SAL,paid:0});
          changed=true;
        }
      }
    }
  }
  if(changed) data.accruals.sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  return changed;
}

function monthsTouchedSince(anchorDateStr, today){
  const a = parseDate(anchorDateStr);
  return (today.getFullYear()-a.getFullYear())*12 + (today.getMonth()-a.getMonth()) + 1;
}

// Долг по ЗП по методике Светланы — см. правила выше. Считает и на сегодня,
// и на любую будущую дату (просто пересчитается сама при заходе в приложение).
function calcSvetlanaDebt(data, today){
  today = today || new Date();
  const months = monthsTouchedSince(SVETLANA_BASE_DATE, today);
  const cutoff = parseDate(SVETLANA_CUTOFF_DATE);
  let received = 0;
  for(const p of data.payments){
    if(parseDate(p.date) > cutoff) received += p.amount;
  }
  return SVETLANA_BASE_DEBT + SVETLANA_MONTHLY_TOTAL*months - received;
}

function calcStats(data){
  // Долг по ЗП теперь считается по методике Светланы (см. правила выше),
  // а не по сумме остатков в таблице начислений — так он реально сходится
  // с её расчётом и продолжит сходиться дальше, а не только сегодня.
  // Эта цифра УЖЕ включает Согл. в Индии (Светлана сама так считает).
  let totalAccrued=0, indiaAccrued=0;
  for(const a of data.accruals){
    const tot=a.white+a.gray;
    totalAccrued+=tot;
    if(a.type==='Согл. в Индии') indiaAccrued+=tot;
  }
  let paymentsTotal=0;
  for(const p of data.payments) paymentsTotal+=p.amount;

  const salaryDebt = calcSvetlanaDebt(data);

  return {
    totalAccrued,
    paymentsTotal,
    salaryDebt,
    indiaAccrued, // справочно: сколько всего начислено по Индии (уже внутри salaryDebt, не прибавлять)
    interestDebt: data.interestDebt,
    totalDebt: salaryDebt+data.interestDebt
  };
}

function statusStr(paid,total){
  if(paid<=0) return 'Не получено';
  if(paid>=total) return 'Получено';
  return 'Частично';
}
function statusClass(paid,total){
  if(paid<=0) return 'stat-unpaid';
  if(paid>=total) return 'stat-paid';
  return 'stat-part';
}

function renderAll(){

  const stats=calcStats(data);

  document.getElementById('cards').innerHTML=[
    {l:'Общий долг',v:stats.totalDebt,c:'debt'},
    {l:'Долг по ЗП (сверено со Светланой)',v:stats.salaryDebt,c:'debt'},
    {l:'Долг по %',v:stats.interestDebt,c:'debt',link:'https://github.com/kooovash-ux/salary-tracker/raw/master/%D0%94%D0%B5%D0%BA%D0%B0%D0%B1%D1%80%D1%8C.xlsx'},

  ].map(c=>{

    return `<div class="card"><div class="label">${c.l}</div>${c.link?`<a href="${c.link}" target="_blank" style="text-decoration:none;color:inherit">${val}</a>`:val}</div>`;
  }).join('');

  const rulesEl = document.getElementById('svetlanaRules');
  if(rulesEl){
    rulesEl.innerHTML = `
      <div class="section" style="margin-top:0">Как считает Светлана</div>
      <div class="rules-box">
        <ol>
          <li>База: долг на 01.06.2026 = 240 900 ₽ (цифру дала Оксана, уже включает всё по 09.06.2026).</li>
          <li>Каждый месяц (включая текущий незакрытый) начисляется фиксированно <b>180 000 ₽</b> — белая + серая + Согласовано в Индии одной суммой, от рабочих дней не зависит.</li>
          <li>Белая часть внутри — 41 000 оклад минус 13% НДФЛ = 35 670 на руки (14 000 аванс + 21 670 зарплата), всегда одна и та же.</li>
          <li>Остальное (144 330 ₽/мес) — без графика, любыми поступлениями по факту.</li>
          <li>Деньги, пришедшие в месяце M+1, закрывают потребность месяца M (сдвиг на месяц — подтверждено ею).</li>
          <li>Излишек сверх нужды месяца уменьшает накопленный долг, а не текущий месяц.</li>
        </ol>
      </div>`;
  }

  const monthNames = ['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const sorted=[...data.accruals].sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  let prevMonth='';
  document.getElementById('accBody').innerHTML=sorted.map(a=>{
    const d=parseDate(a.date);
    const mk=d.getFullYear()+'-'+d.getMonth();
    let head='';
    if(mk!==prevMonth){
      prevMonth=mk;
      head=`<tr class="month-head"><td colspan="9">${monthNames[d.getMonth()+1]} ${d.getFullYear()}</td></tr>`;
    }
    const tot=a.white+a.gray, rem=tot-a.paid;
    const st=statusStr(a.paid,tot), sc=statusClass(a.paid,tot);
    return head+`<tr>
      <td>${a.id}</td>
      <td>${a.date}</td>
      <td>${a.type}</td>
      <td class="num">${fm(a.white)}</td>
      <td class="num">${fm(a.gray)}</td>
      <td class="num">${fm(tot)}</td>
      <td class="num">${fm(a.paid)}</td>
      <td class="num">${fm(rem)}</td>
      <td class="${sc}">${st}</td>
    </tr>`;
  }).join('') + '\n' + (() => {
    const sw=sorted.reduce((s,a)=>s+a.white,0);
    const sg=sorted.reduce((s,a)=>s+a.gray,0);
    const stt=sorted.reduce((s,a)=>s+a.white+a.gray,0);
    const sp=sorted.reduce((s,a)=>s+a.paid,0);
    const sr=sorted.reduce((s,a)=>s+a.white+a.gray-a.paid,0);
    return `<tr class="total-row"><td colspan="3">ИТОГО</td><td class="num">${fm(sw)}</td><td class="num">${fm(sg)}</td><td class="num">${fm(stt)}</td><td class="num">${fm(sp)}</td><td class="num">${fm(sr)}</td><td></td></tr>`;
  })();

  const ps=[...data.payments].sort((a,b)=>parseDate(a.date)-parseDate(b.date));

    <span><span class="sl">Начислено:</span> <span class="sv">${fm(stats.totalAccrued)} &#8381;</span></span>

function applyFIFO(data,amount){
  // "Согл. в Индии" гасится отдельно (Оксана), обычные поступления её не трогают,
  // иначе дата 1-го числа каждого месяца утянет на себя платёж раньше аванса/зарплаты.
  let rem=amount;
  const sorted=[...data.accruals]
    .filter(a=>a.type!=='Согл. в Индии')
    .sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  for(const a of sorted){
    if(rem<=0) break;
    const unpaid=(a.white+a.gray)-a.paid;
    if(unpaid>0){
      const r=Math.min(unpaid,rem);
      a.paid+=r;
      rem-=r;
    }
  }
}

function addPayment(){
  const data=loadData();
  if(!data) return;
  const de=document.getElementById('payDate'), ae=document.getElementById('payAmount'), ce=document.getElementById('payComment');
  let date=de.value;
  if(!date){date=fmtDate(new Date());de.value=date}
  const amount=parseInt(ae.value);
  if(!amount||amount<1){alert('Введите сумму');return}
  data.payments.push({id:data.nextPayId++,date,amount,comment:ce.value.trim()||''});
  applyFIFO(data,amount);
  saveData(data);
  ae.value='';ce.value='';
  renderAll();
}

(async function(){
  // reset via ?reset=1 or ?clear=1
  if(location.search.includes('reset')||location.search.includes('clear')){
    try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
    if(location.search.includes('reset')) history.replaceState(null,'',location.pathname);
  }

  // Сначала пробуем облако (актуальнее, синхронизировано со всех устройств).
  // Если офлайн/ошибка — работаем с локальной копией как раньше.
  let data = await fetchCloudData();
  if(data){
    setSyncStatus(true);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } else {
    setSyncStatus(false);
    data = loadData();
    if(data && data.version !== DATA_VERSION){
      try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
      data=seedData();
    }
    if(!data){data=seedData();}
  }

  generateAutoAccruals(data);
  data.accruals.sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  saveData(data);
  document.getElementById('addPayBtn').addEventListener('click',addPayment);
  document.getElementById('payAmount').addEventListener('keydown',function(e){if(e.key==='Enter')addPayment()});

  document.getElementById('showImportBtn').addEventListener('click',function(e){
    e.preventDefault();
    const box = document.getElementById('importBox');
    box.style.display = box.style.display==='none' ? 'block' : 'none';
  });
  document.getElementById('doImportBtn').addEventListener('click',function(){
    const raw = document.getElementById('importText').value.trim();
    if(!raw) return;
    let parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ alert('Не получилось разобрать JSON: '+e.message); return; }
    const d = loadData();

    // Поддерживает и старый формат (просто список поступлений), и новый
    // {accruals:[...], payments:[...]} - для полного восстановления.
    const accList = Array.isArray(parsed) ? [] : (parsed.accruals || []);
    const payList = Array.isArray(parsed) ? parsed : (parsed.payments || []);

    let addedAcc = 0;
    for(const item of accList){
      if(!item.date || !item.type) continue;
      if(d.accruals.some(a=>a.date===item.date && a.type===item.type)) continue;
      d.accruals.push({id:d.nextAccId++, date:item.date, type:item.type, white:item.white||0, gray:item.gray||0, paid:0});
      addedAcc++;
    }
    if(addedAcc) d.accruals.sort((a,b)=>parseDate(a.date)-parseDate(b.date));

    let addedPay = 0;
    for(const item of payList){
      if(!item.date || !item.amount) continue;
      // не добавлять дубликат: та же дата+сумма уже есть
      if(d.payments.some(p=>p.date===item.date && p.amount===item.amount)) continue;
      d.payments.push({id:d.nextPayId++, date:item.date, amount:item.amount, comment:item.comment||''});
      applyFIFO(d, item.amount);
      addedPay++;
    }

    generateAutoAccruals(d);
    d.accruals.sort((a,b)=>parseDate(a.date)-parseDate(b.date));
    saveData(d);
    document.getElementById('importText').value='';
    document.getElementById('importBox').style.display='none';
    renderAll();
    alert(`Начислений добавлено: ${addedAcc}, поступлений: ${addedPay}`);
  });

  renderAll();
})();

// PIN check
(function(){
  const pin = sessionStorage.getItem('salary_pin');
  if(pin === APP_PIN){
    document.getElementById('pinOverlay').style.display='none';
    document.getElementById('content').style.display='block';
    return;
  }
  const overlay = document.getElementById('pinOverlay');
  const input = document.getElementById('pinInput');
  const err = document.getElementById('pinErr');
  const btn = document.getElementById('pinBtn');
  function check(){
    if(input.value === APP_PIN){
      sessionStorage.setItem('salary_pin', APP_PIN);
      overlay.style.display='none';
      document.getElementById('content').style.display='block';
    } else {
      err.textContent='Неверный ПИН-код';
      input.value='';
      input.focus();
    }
  }
  btn.addEventListener('click', check);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
  input.focus();
})();
